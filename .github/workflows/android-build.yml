name: Build SARTHI Android APK & AAB

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android Release Artifacts (APK & AAB)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java JDK (v17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Build Unsigned Release APK
        run: |
          cd android
          ./gradlew assembleRelease --stacktrace

      - name: Build Unsigned Release AAB (Android App Bundle)
        run: |
          cd android
          ./gradlew bundleRelease --stacktrace

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sarthi-release-apk
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error

      - name: Upload Release AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sarthi-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

  create-release:
    name: Create GitHub Release
    needs: build-android
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: sarthi-release-apk
          path: release-artifacts/

      - name: Download AAB Artifact
        uses: actions/download-artifact@v4
        with:
          name: sarthi-release-aab
          path: release-artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/app-release-unsigned.apk
            release-artifacts/app-release.aab
          body_path: RELEASE_NOTES_v1.0.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
